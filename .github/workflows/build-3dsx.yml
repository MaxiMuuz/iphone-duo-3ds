name: Build 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS tools
        run: dkp-pacman -Sy --noconfirm 3ds-dev

      - name: Check assets
        run: python3 tools/check_assets.py

      - name: Build
        working-directory: iphone-duo-3ds-native
        run: |
          chmod +x build.sh
          ./build.sh -j4

      - name: Upload .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: iphone-duo-3ds
          path: "**/*.3dsx"
          if-no-files-found: error